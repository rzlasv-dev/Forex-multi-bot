name: Forex Multi-Pair Scanner

on:
  workflow_dispatch:
  repository_dispatch:
    types: [next-relay]
  schedule:
    - cron: '0 */6 * * 1-5'

concurrency:
  group: forex-runner-singleton
  cancel-in-progress: true

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Forex Engine (5.5 Hours Relay)
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_API_KEY: ${{ secrets.TWELVE_API_KEY }}
        run: |
          python -u bot.py

      - name: Auto-Relay to Next Runner
        if: always() && !cancelled()
        run: |
          curl --fail --retry 3 --retry-delay 5 -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"next-relay"}'
